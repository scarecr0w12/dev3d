<!doctype html>
<!--
  `data-theme="dark"` used to sit on this element and was inert: `styles.css` has no
  `data-theme` rules and no `prefers-color-scheme` block, so nothing ever read it,
  while the *functional* declaration of the theme is the `color-scheme` meta below
  (it is what makes form controls and scrollbars dark). An attribute that looks like
  a switch and switches nothing is worse than no attribute.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="dev3d office: the management console for a 3D office of LLM agents - org chart, run transcript, approvals, routing telemetry."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Cpath d='M7 20.5 16 7l9 13.5H7Z' fill='%2338bdf8'/%3E%3Ccircle cx='16' cy='23' r='2.6' fill='%23f59e0b'/%3E%3C/svg%3E"
    />
    <title>dev3d office — agent orchestrator</title>
    <style>
      /* First paint, before styles.css loads: keep the page from flashing white. */
      html,
      body {
        margin: 0;
        background: #07080b;
        color: #e6e9ef;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
